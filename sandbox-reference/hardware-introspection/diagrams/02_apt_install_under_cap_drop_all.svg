<text text-anchor="middle" x="341.5" y="-609.82" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#ffdada">apt&#39;s OWN internal hardening:</text>
<text text-anchor="middle" x="341.5" y="-594.82" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#ffdada">drops privileges to its _apt</text>
<text text-anchor="middle" x="341.5" y="-579.82" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#ffdada">sandbox user for the download step</text>
<text text-anchor="middle" x="341.5" y="-564.82" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#ffdada">→ needs CAP_SETUID/CAP_SETGID</text>
<text text-anchor="middle" x="341.5" y="-549.82" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#ffdada">→ stripped by &#45;&#45;cap&#45;drop ALL,</text>
<text text-anchor="middle" x="341.5" y="-534.82" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#ffdada">regardless of exec uid</text>
</g>
