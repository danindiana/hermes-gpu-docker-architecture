<text text-anchor="middle" x="784.5" y="-48.81" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#ffdada">regardless of uid — a real</text>
<text text-anchor="middle" x="784.5" y="-33.81" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#ffdada">security boundary, not a bug.</text>
</g>
