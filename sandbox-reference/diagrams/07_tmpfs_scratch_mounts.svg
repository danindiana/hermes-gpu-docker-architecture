<text text-anchor="middle" x="1659.31" y="-240.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#8b5cf6">Rule of thumb: /workspace for anything that matters, /tmp or /var/tmp only</text>
<text text-anchor="middle" x="1659.31" y="-225.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#8b5cf6">for genuine scratch you&#39;re fine losing on the next container restart —</text>
<text text-anchor="middle" x="1659.31" y="-210.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#8b5cf6">a tighter bar than the &quot;survives restarts, lost on recreation&quot; tier</text>
<text text-anchor="middle" x="1659.31" y="-195.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#8b5cf6">that /home/pn and pip/apt installs fall into (see diagrams 01 and 04).</text>
<text text-anchor="middle" x="1659.31" y="-180.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#8b5cf6">All three tmpfs mounts are noexec in practice — never build or run a</text>
