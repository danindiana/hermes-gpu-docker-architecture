<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e12"/>
      <stop offset="100%" stop-color="#0d1a22"/>
    </linearGradient>
    <linearGradient id="neon1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ffb0"/>
      <stop offset="100%" stop-color="#39d0ff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="160" rx="14" fill="url(#bg)"/>
  <!-- sandbox crate -->
  <g transform="translate(35,35)" stroke="#ff9f4d" stroke-width="3" fill="none">
    <path d="M0,22 L45,0 L90,22 L45,44 Z" fill="#2a1a0d"/>
    <path d="M0,22 L0,78 L45,100 L45,44 Z" fill="#241a0d"/>
    <path d="M90,22 L90,78 L45,100 L45,44 Z" fill="#1c1408"/>
    <path d="M0,22 L45,44 L90,22" fill="none"/>
  </g>
  <!-- open padlock: hardened but permeable where deliberate -->
  <g transform="translate(160,50)" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round">
    <rect x="0" y="20" width="36" height="28" rx="4" fill="#1c1430"/>
    <path d="M6,20 L6,10 A12,12 0 0 1 30,10 L30,14"/>
    <circle cx="18" cy="34" r="3" fill="#8b5cf6" stroke="none"/>
  </g>
  <!-- document / reference page -->
  <g transform="translate(230,32)">
    <path d="M0,0 L56,0 L70,14 L70,96 L0,96 Z" fill="#0f2a20" stroke="#39ffb0" stroke-width="2.5"/>
    <path d="M56,0 L56,14 L70,14 Z" fill="#0d1a22" stroke="#39ffb0" stroke-width="2"/>
    <g stroke="url(#neon1)" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="30" x2="58" y2="30"/>
      <line x1="12" y1="44" x2="58" y2="44"/>
      <line x1="12" y1="58" x2="42" y2="58"/>
    </g>
  </g>
  <!-- network node motif, echoing the parent repo mark -->
  <g transform="translate(330,50)">
    <circle cx="10" cy="30" r="6" fill="#0f2a20" stroke="#39d0ff" stroke-width="2"/>
    <circle cx="42" cy="8" r="6" fill="#0f2a20" stroke="#39d0ff" stroke-width="2"/>
    <circle cx="42" cy="52" r="6" fill="#0f2a20" stroke="#39d0ff" stroke-width="2"/>
    <g stroke="#39d0ff" stroke-width="1.75" opacity="0.85">
      <line x1="10" y1="30" x2="42" y2="8"/>
      <line x1="10" y1="30" x2="42" y2="52"/>
    </g>
  </g>
  <text x="240" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#dfe6ee">sandbox-reference</text>
  <text x="240" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7d8a99">what the docker sandbox actually does</text>
</svg>
