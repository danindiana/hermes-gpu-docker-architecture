<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e12"/>
      <stop offset="100%" stop-color="#0d1a22"/>
    </linearGradient>
    <linearGradient id="neon1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ffb0"/>
      <stop offset="100%" stop-color="#39d0ff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="160" rx="14" fill="url(#bg)"/>
  <!-- GPU chip -->
  <g transform="translate(30,40)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#152a3a" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="14" y="14" width="52" height="52" rx="4" fill="#241a3a" stroke="#8b5cf6" stroke-width="1.5"/>
    <g stroke="#8b5cf6" stroke-width="2">
      <line x1="0" y1="18" x2="-10" y2="18"/>
      <line x1="0" y1="38" x2="-10" y2="38"/>
      <line x1="0" y1="58" x2="-10" y2="58"/>
      <line x1="80" y1="18" x2="90" y2="18"/>
      <line x1="80" y1="38" x2="90" y2="38"/>
      <line x1="80" y1="58" x2="90" y2="58"/>
    </g>
  </g>
  <!-- container brackets (docker) -->
  <g transform="translate(150,50)" stroke="#ff9f4d" stroke-width="3" fill="none">
    <path d="M0,0 L0,60 L50,60"/>
    <path d="M18,60 L18,72 L68,72 L68,12"/>
  </g>
  <!-- hermes wing / network node motif -->
  <g transform="translate(250,45)">
    <circle cx="15" cy="35" r="7" fill="#0f2a20" stroke="#39ffb0" stroke-width="2"/>
    <circle cx="55" cy="10" r="7" fill="#0f2a20" stroke="#39ffb0" stroke-width="2"/>
    <circle cx="55" cy="60" r="7" fill="#0f2a20" stroke="#39ffb0" stroke-width="2"/>
    <circle cx="90" cy="35" r="9" fill="#0f2a20" stroke="#39d0ff" stroke-width="2.5"/>
    <g stroke="url(#neon1)" stroke-width="2">
      <line x1="15" y1="35" x2="55" y2="10"/>
      <line x1="15" y1="35" x2="55" y2="60"/>
      <line x1="55" y1="10" x2="90" y2="35"/>
      <line x1="55" y1="60" x2="90" y2="35"/>
    </g>
  </g>
  <text x="240" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#dfe6ee">hermes-gpu-docker-architecture</text>
</svg>
